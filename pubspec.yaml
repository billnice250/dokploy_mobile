name: dokploy_mobile
description: A polished, unofficial  mobile console for Dokploy.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  crypto: ^3.0.6
  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  go_router: ^14.6.2
  intl: ^0.20.1
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  web_socket_channel: ^3.0.1
  flutter_local_notifications: ^21.0.0
  file_picker: ^11.0.3
  pkcs7: ^1.0.6
  pfx_reader: ^1.0.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  config:
    # flutter_secure_storage still requires CocoaPods on iOS. Keep one native
    # dependency manager until every production plugin supports SwiftPM.
    enable-swift-package-manager: false
  assets:
    - assets/branding/dokploy-mark.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/dokploy-mark.png
  remove_alpha_ios: true
  min_sdk_android: 24

flutter_native_splash:
  color: "#0A0A0A"
  image: assets/branding/dokploy-mark.png
  color_dark: "#0A0A0A"
  image_dark: assets/branding/dokploy-mark.png
  android: true
  ios: true
  fullscreen: false
  android_12:
    color: "#0A0A0A"
    image: assets/branding/dokploy-mark.png
    color_dark: "#0A0A0A"
    image_dark: assets/branding/dokploy-mark.png
